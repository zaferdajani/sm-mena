# Deploys Sawwiq to Fly.io on every push to main.
#
# One-time setup (browser only):
#   1. Fly dashboard → Account → Access Tokens → create an org-scoped token.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions:
#        FLY_API_TOKEN        (required)
#        SEED_ADMIN_EMAIL     (recommended: your admin login)
#        SEED_ADMIN_PASSWORD  (recommended: a strong password)
#        ANTHROPIC_API_KEY    (optional: Claude runs the matchmaker)
#        OPENAI_API_KEY       (optional: OpenAI runs the matchmaker)
#        AI_PROVIDER, ANTHROPIC_MODEL, OPENAI_MODEL (optional: see .env.example)
#        GOOGLE_PLACES_API_KEY (optional: Google ratings)
#        CRON_SECRET          (optional: lets an external scheduler call
#                              /api/cron/google; generated if missing)
#        DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#                             (optional: run on Supabase Postgres + Storage;
#                              the first boot copies the old data across,
#                              docs/25-supabase.md)
#   3. Own domain (optional): Settings → Secrets and variables → Actions →
#      Variables → New repository variable SITE_URL = https://your-domain
#      (no trailing slash). The next deploy requests the HTTPS certificate and
#      prints the DNS records to add; the site switches to the domain on the
#      first deploy after the domain answers (docs/19-domain.md).
# The first run creates the app and its volume. Without FLY_API_TOKEN the job
# skips with a notice instead of failing.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_REGION: fra
    steps:
      - name: Skip when Fly is not configured
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed. See the comment at the top of .github/workflows/fly-deploy.yml."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.go == 'true'

      - name: Read the app name from fly.toml
        if: steps.gate.outputs.go == 'true'
        id: app
        run: echo "name=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml)" >> "$GITHUB_OUTPUT"

      - name: Create the app and volume on first run
        if: steps.gate.outputs.go == 'true'
        run: |
          APP="${{ steps.app.outputs.name }}"
          flyctl apps list --json | grep -q "\"Name\": *\"$APP\"" || flyctl apps create "$APP" --org personal
          flyctl volumes list -a "$APP" --json | grep -q '"name": *"sawwiq_data"' || flyctl volumes create sawwiq_data -a "$APP" --region "$FLY_REGION" --size 1 --yes

      - name: Stage secrets that are present in GitHub (values are never printed)
        if: steps.gate.outputs.go == 'true'
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          # NAME=VALUE lines fed to `flyctl secrets import`, so values with
          # symbols (database passwords) are passed exactly, never re-parsed by the shell.
          lines="$RUNNER_TEMP/fly-secrets"
          umask 077; : > "$lines"
          for name in SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD ANTHROPIC_API_KEY OPENAI_API_KEY AI_PROVIDER ANTHROPIC_MODEL OPENAI_MODEL GOOGLE_PLACES_API_KEY CRON_SECRET DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            value="$(printenv "$name" || true)"
            [ -n "$value" ] && printf '%s=%s\n' "$name" "$value" >> "$lines"
          done
          # Supabase (docs/25-supabase.md): files go to Supabase Storage too.
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "STORAGE_PROVIDER=supabase" >> "$lines"
          existing="$(flyctl secrets list -a "$APP" 2>/dev/null || true)"
          grep -q '^CRON_SECRET=' "$lines" || echo "$existing" | grep -q CRON_SECRET || echo "CRON_SECRET=$(openssl rand -hex 24)" >> "$lines"
          # Generated once and kept: it encrypts two-factor secrets, so never rotate it casually.
          echo "$existing" | grep -q MFA_ENCRYPTION_KEY || echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '=+/')" >> "$lines"
          echo "$existing" | grep -q PAYMENTS_WEBHOOK_SECRET || echo "PAYMENTS_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$lines"
          [ -s "$lines" ] && flyctl secrets import -a "$APP" --stage < "$lines" > /dev/null || true
          rm -f "$lines"

      - name: Own domain (when the SITE_URL variable is set)
        if: steps.gate.outputs.go == 'true'
        id: domain
        env:
          # The SITE_URL repository variable overrides the default domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://sawwiq.org' }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          URL="https://$APP.fly.dev"
          if [ -n "$SITE_URL" ]; then
            HOST="$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')"
            for h in "$HOST" "www.$HOST"; do
              flyctl certs show "$h" -a "$APP" > /dev/null 2>&1 || flyctl certs add "$h" -a "$APP" || true
            done
            echo "::group::DNS records for $HOST (add these at your domain registrar)"
            flyctl certs setup "$HOST" -a "$APP" 2>/dev/null || flyctl certs show "$HOST" -a "$APP" || true
            flyctl certs setup "www.$HOST" -a "$APP" 2>/dev/null || true
            flyctl ips list -a "$APP" || true
            echo "::endgroup::"
            # Switch only when the domain already reaches this app over HTTPS,
            # so a deploy never points links and redirects at a dead address.
            if curl -fsS --max-time 10 "https://$HOST/api/health" | grep -q '"ok":true'; then
              URL="https://$HOST"
              echo "::notice::Serving on https://$HOST (fly.dev and www redirect there)."
            else
              echo "::warning::https://$HOST does not reach the app yet: add the DNS records shown above, wait for the certificate, then run this workflow again. Staying on $URL for now."
            fi
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy (one machine)
        if: steps.gate.outputs.go == 'true'
        run: |
          APP="${{ steps.app.outputs.name }}"
          flyctl deploy --remote-only --ha=false -a "$APP" --build-arg NEXT_PUBLIC_SITE_URL="${{ steps.domain.outputs.url }}"

      - name: Verify health
        if: steps.gate.outputs.go == 'true'
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          APP="${{ steps.app.outputs.name }}"
          # The first boot on Supabase copies the old data across first (a few minutes).
          for i in $(seq 1 72); do
            curl -fsS "https://$APP.fly.dev/api/health" > health.json 2>/dev/null && break
            sleep 5
          done
          cat health.json; echo
          grep -q '"ok":true' health.json
          if [ "$HAS_DATABASE_URL" = "true" ] && ! grep -q '"database":"postgres' health.json; then
            echo "::warning::DATABASE_URL is set but the app is still on the embedded database: the move to Supabase failed. Check 'flyctl logs' for lines starting with [move] (docs/25-supabase.md)."
          fi
          if [ "$HAS_DATABASE_URL" = "true" ] && ! grep -q '"storage":"supabase"' health.json; then
            if [ "$HAS_SUPABASE_URL" != "true" ] || [ "$HAS_SUPABASE_KEY" != "true" ]; then
              echo "::warning::Files are still served from the Fly disk: GitHub secret SUPABASE_URL is set=$HAS_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY is set=$HAS_SUPABASE_KEY. Add the missing one (exact name) and deploy again."
            else
              echo "::warning::Files are still served from the Fly disk: copying them to Supabase Storage failed. Check 'flyctl logs' for lines starting with [move] (usually a wrong service_role key)."
            fi
          fi
          echo "::notice::Live at ${{ steps.domain.outputs.url }}"
