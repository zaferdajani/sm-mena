name: Public production pages - read-only evidence
on:
  push:
    branches: [audit/public-landing-profiles-20260927]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install isolated public browser
        run: |
          mkdir -p audit-browser
          cd audit-browser
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Public browsing interactions only
        run: |
          cat > audit-browser/capture.cjs <<'PUBLIC_AUDIT_JS'
          const {chromium} = require('playwright');
          const fs=require('node:fs');
          const path=require('node:path');
          const origin='https://sawwiq.org';
          const out=path.join(process.env.GITHUB_WORKSPACE,'public-interaction-evidence');
          fs.mkdirSync(out,{recursive:true});
          const report={startedAt:new Date().toISOString(),target:origin,pages:[],interactions:[]};
          async function settle(page){await page.evaluate(()=>Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,8000))]));await page.waitForTimeout(800);}
          async function dismiss(page){
            const skip=page.getByRole('button',{name:/^skip$|تخطّي|تخطي/i}).first();
            if(await skip.isVisible().catch(()=>false))await skip.click({timeout:4000}).catch(()=>{});
            const browse=page.getByTestId('welcome-browse');
            if(await browse.isVisible().catch(()=>false))await browse.click();
            await settle(page);
          }
          async function capture(page,name){
            await settle(page); await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(700);
            const item=await page.evaluate(()=>({url:location.href,title:document.title,h1:[...document.querySelectorAll('h1')].map(e=>e.innerText),dir:document.documentElement.dir,theme:document.documentElement.dataset.theme||null,scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,text:document.body.innerText,links:[...document.querySelectorAll('a')].map(e=>({text:e.innerText,href:e.getAttribute('href')}))}));
            item.name=name;item.at=new Date().toISOString();
            await page.screenshot({path:path.join(out,name+'-viewport.png'),animations:'disabled'});
            await page.screenshot({path:path.join(out,name+'-full.png'),fullPage:true,animations:'disabled'});
            report.pages.push(item);
            console.log('PUBLIC_VIEW '+JSON.stringify({name,at:item.at,url:item.url,h1:item.h1,dir:item.dir,theme:item.theme,scrollWidth:item.scrollWidth,viewport:item.viewport}));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const [lang,width] of [['ar',390],['ar',1440],['en',390],['en',1440]]){
                const ctx=await browser.newContext({viewport:{width,height:width===390?844:1000},locale:lang==='ar'?'ar-JO':'en-US',timezoneId:'Asia/Amman',serviceWorkers:'block',extraHTTPHeaders:{'Cache-Control':'no-cache'}});
                const page=await ctx.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto(origin+'/'+lang,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2500);await dismiss(page);
                await capture(page,'landing-'+lang+'-'+width+'-after-welcome');
                if(lang==='ar'&&width===390){
                  const select=page.getByTestId('country-picker').locator('select').first();
                  for(const [value,word] of [['sa','السعودية'],['eg','مصر']]){
                    await select.selectOption(value);
                    await page.waitForFunction(word=>document.querySelector('h1')?.innerText.includes(word),word,{timeout:20000});
                    await capture(page,'landing-after-country-'+value);
                    report.interactions.push({action:'country selector',selected:value,url:page.url(),heading:await page.locator('h1').first().innerText()});
                  }
                  await page.locator('a[href="/en"]').first().click();await page.waitForURL('**/en');await dismiss(page);
                  await capture(page,'landing-after-language-English');
                  report.interactions.push({action:'language link',url:page.url(),dir:await page.locator('html').getAttribute('dir')});
                }
                report.interactions.push({page:lang+'-'+width,errors});await ctx.close();
              }
              const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'ar-JO',timezoneId:'Asia/Amman'});
              const page=await ctx.newPage();await page.goto(origin+'/ar',{waitUntil:'domcontentloaded'});await page.waitForTimeout(3000);
              const skip=page.getByRole('button',{name:/تخطّي|تخطي/i}).first();if(await skip.isVisible().catch(()=>false))await skip.click().catch(()=>{});
              const agency=page.getByTestId('welcome-agency');
              if(await agency.isVisible().catch(()=>false)){
                const before=page.url();await agency.click();await page.waitForURL('**/join');
                report.interactions.push({action:'welcome agency or freelancer choice',from:before,to:page.url()});await capture(page,'provider-entry-destination');
              }
              await ctx.close();
              for(const [handle,lang,width] of [['mahaalbashiti','ar',390],['mahaalbashiti','en',1440],['meerobox','ar',390]]){
                const c=await browser.newContext({viewport:{width,height:width===390?844:1000},locale:lang==='ar'?'ar-JO':'en-US',timezoneId:'Asia/Amman'});
                const p=await c.newPage();await p.goto(origin+'/'+lang+'/a/'+handle,{waitUntil:'domcontentloaded'});await settle(p);
                const toggles=p.getByTestId('theme-toggle');let changed=false;
                for(let i=0;i<await toggles.count();i++){if(await toggles.nth(i).isVisible()){await toggles.nth(i).click();changed=true;break;}}
                await capture(p,handle+'-'+lang+'-'+width+'-dark');
                report.interactions.push({action:'public dark theme toggle',handle,changed,theme:await p.locator('html').getAttribute('data-theme')});await c.close();
              }
            }catch(error){report.error=error.message;console.log('AUDIT_ERROR '+error.stack);process.exitCode=1;}
            finally{report.finishedAt=new Date().toISOString();fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));console.log('INTERACTIONS '+JSON.stringify(report.interactions));await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          PUBLIC_AUDIT_JS
          node audit-browser/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-interaction-evidence
          path: public-interaction-evidence/
          retention-days: 3
