name: Public production pages - read-only evidence
on:
  push:
    branches: [audit/public-landing-profiles-20260927]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install isolated public browser
        run: |
          mkdir -p audit-browser
          cd audit-browser
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Public interaction evidence without account changes
        run: |
          cat > audit-browser/capture.cjs <<'PUBLIC_AUDIT_JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');const path=require('node:path');
          const origin='https://sawwiq.org';
          const out=path.join(process.env.GITHUB_WORKSPACE,'public-final-evidence');fs.mkdirSync(out,{recursive:true});
          const report={startedAt:new Date().toISOString(),target:origin,cases:[]};
          async function settle(p){await p.evaluate(()=>Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,6000))]));await p.waitForTimeout(900);}
          async function dismiss(p){const skip=p.getByRole('button',{name:/^skip$|تخطّي|تخطي/i}).first();if(await skip.isVisible().catch(()=>false))await skip.click({timeout:2500}).catch(()=>{});const browse=p.getByTestId('welcome-browse');if(await browse.isVisible().catch(()=>false))await browse.click();await settle(p);}
          async function shot(p,name,item){await settle(p);await p.evaluate(()=>scrollTo(0,0));item.view=await p.evaluate(()=>({url:location.href,h1:[...document.querySelectorAll('h1')].map(e=>e.innerText),dir:document.documentElement.dir,theme:document.documentElement.dataset.theme||null,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,text:document.body.innerText,pickers:[...document.querySelectorAll('[data-testid="country-picker"] select')].map(e=>({value:e.value,disabled:e.disabled})),links:[...document.querySelectorAll('a')].map(e=>({text:e.innerText,href:e.getAttribute('href')}))}));item.capturedAt=new Date().toISOString();await p.screenshot({path:path.join(out,name+'-viewport.png'),animations:'disabled'});await p.screenshot({path:path.join(out,name+'-full.png'),fullPage:true,animations:'disabled'});}
          const cases=[
            {name:'landing-ar-desktop-clear',route:'/ar',width:1440,lang:'ar',action:'browse'},
            {name:'landing-en-desktop-clear',route:'/en',width:1440,lang:'en',action:'browse'},
            {name:'landing-en-phone-clear',route:'/en',width:390,lang:'en',action:'browse'},
            {name:'country-switch-egypt',route:'/ar',width:390,lang:'ar',action:'country',initialCountry:'jo'},
            {name:'language-switch-English',route:'/ar',width:390,lang:'ar',action:'language'},
            {name:'provider-welcome-destination',route:'/ar',width:390,lang:'ar',action:'provider'},
            {name:'bashiti-ar-phone-dark',route:'/ar/a/mahaalbashiti',width:390,lang:'ar',action:'dark'},
            {name:'bashiti-en-desktop-dark',route:'/en/a/mahaalbashiti',width:1440,lang:'en',action:'dark'},
            {name:'meerobox-ar-phone-dark',route:'/ar/a/meerobox',width:390,lang:'ar',action:'dark'}
          ];
          (async()=>{const browser=await chromium.launch({headless:true});try{for(const c of cases){const item={...c,at:new Date().toISOString(),errors:[]};const ctx=await browser.newContext({viewport:{width:c.width,height:c.width===390?844:1000},locale:c.lang==='ar'?'ar-JO':'en-US',timezoneId:'Asia/Amman',serviceWorkers:'block',extraHTTPHeaders:{'Cache-Control':'no-cache'}});if(c.initialCountry)await ctx.addCookies([{name:'sw_country',value:c.initialCountry,domain:'sawwiq.org',path:'/',sameSite:'Lax',secure:true}]);const p=await ctx.newPage();p.on('pageerror',e=>item.errors.push(e.message));try{const res=await p.goto(origin+c.route,{waitUntil:'domcontentloaded',timeout:40000});item.status=res?.status();await p.waitForTimeout(3000);
            if(c.action!=='provider'&&c.action!=='dark')await dismiss(p);
            if(c.action==='country'){const sel=p.getByTestId('country-picker').locator('select').first();item.before={value:await sel.inputValue(),h1:await p.locator('h1').allTextContents()};await sel.selectOption('eg');await p.waitForTimeout(3000);item.expectedHeading=await p.waitForFunction(()=>document.querySelector('h1')?.innerText.includes('مصر'),null,{timeout:10000}).then(()=>true).catch(()=>false);item.countryCookie=(await ctx.cookies()).find(c=>c.name==='sw_country')?.value;}
            if(c.action==='language'){await p.locator('a[href="/en"]').first().click();item.reachedEnglish=await p.waitForURL('**/en',{timeout:20000}).then(()=>true).catch(()=>false);await dismiss(p);}
            if(c.action==='provider'){const skip=p.getByRole('button',{name:/تخطّي|تخطي/i}).first();if(await skip.isVisible().catch(()=>false))await skip.click().catch(()=>{});const link=p.getByTestId('welcome-agency');item.linkWasVisible=await link.isVisible();if(item.linkWasVisible){item.providerHref=await link.getAttribute('href');await link.click();item.reachedJoin=await p.waitForURL('**/join',{timeout:20000}).then(()=>true).catch(()=>false);}}
            if(c.action==='dark'){item.themeBefore=await p.locator('html').getAttribute('data-theme');const ts=p.getByTestId('theme-toggle');item.toggleClicked=false;for(let i=0;i<await ts.count();i++){if(await ts.nth(i).isVisible()){await ts.nth(i).click();item.toggleClicked=true;break;}}await p.waitForTimeout(500);}
            await shot(p,c.name,item);
           }catch(e){item.error=e.message;await shot(p,c.name+'-error',item).catch(()=>{});}finally{report.cases.push(item);console.log('PUBLIC_RESULT '+JSON.stringify({name:item.name,status:item.status,url:item.view?.url,dir:item.view?.dir,h1:item.view?.h1,theme:item.view?.theme,toggle:item.toggleClicked,expectedHeading:item.expectedHeading,countryCookie:item.countryCookie,pickers:item.view?.pickers,reachedJoin:item.reachedJoin,reachedEnglish:item.reachedEnglish,error:item.error,errors:item.errors}));fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));await ctx.close();}}}finally{report.finishedAt=new Date().toISOString();fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));await browser.close();}})().catch(e=>{console.error(e);process.exitCode=1;});
          PUBLIC_AUDIT_JS
          node audit-browser/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-final-evidence
          path: public-final-evidence/
          retention-days: 3
