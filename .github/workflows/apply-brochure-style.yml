name: Apply reviewed brochure design
on:
  push:
    branches: [style/brochure-design-system]
    paths: [.github/workflows/apply-brochure-style.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: style/brochure-design-system
      - name: Apply reviewed presentation-only edits
        run: |
          python3 scripts/apply-brochure-style.py
          git diff --check
          git diff --stat
          git rm scripts/apply-brochure-style.py .github/workflows/brochure-source-context.yml .github/workflows/apply-brochure-style.yml
          git add app components lib/release.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply approved brochure typography, palette and platform compositions'
          git push origin HEAD:style/brochure-design-system
