name: Sawwiq phone builds (iPhone unsigned .ipa + Android APK)

# Manual only: GitHub → Actions → "Sawwiq phone builds" → Run workflow. Never runs on a push (macOS minutes cost
# 10x; the TeamManager budget was emptied that way).
#
# Builds the Expo app in mobile/ with the staging API address baked in (EXPO_PUBLIC_API_URL). The address must be
# a non-production deployment of this web app with API_V1_ENABLED=true and its own database. Localhost and the
# production domain are refused. Results land on fixed GitHub Releases:
#   iphone-latest  → Sawwiq-iPhone.ipa  (unsigned; install with Sideloadly + a free Apple ID)
#   android-latest → Sawwiq-debug.apk  (debug-signed; install directly on Android)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Staging API base URL, e.g. https://sawwiq-staging.example.app (not localhost, not sawwiq.org)"
        required: true
        type: string
      iphone:
        description: "Build the iPhone .ipa (macOS, the costly one)"
        type: boolean
        default: true
      android:
        description: "Build the Android APK (Linux, cheap)"
        type: boolean
        default: true

concurrency:
  group: sawwiq-phone-builds
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-input:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse localhost, the production domain and non-https addresses
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::api_url must start with https://"; exit 1 ;;
          esac
          case "$API_URL" in
            *localhost*|*127.0.0.1*|*\[::1\]*) echo "::error::api_url must not be localhost"; exit 1 ;;
            *sawwiq.org*) echo "::error::api_url must be a staging deployment, not the production domain"; exit 1 ;;
          esac
          echo "API address accepted: $API_URL"

  android:
    needs: check-input
    if: ${{ inputs.android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the native Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the debug APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          cp "$APK" Sawwiq-debug.apk
          ls -lh Sawwiq-debug.apk

      - name: Publish the APK to the Android download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sawwiq — latest Android test build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: Sawwiq-debug.apk
          body: |
            Android test build of Sawwiq, built from `${{ github.sha }}` (run ${{ github.run_id }}).
            API address: ${{ inputs.api_url }}
            Install: download Sawwiq-debug.apk on the phone and allow installs from this source.

  iphone:
    needs: check-input
    if: ${{ inputs.iphone }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the native iOS project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Find the workspace and scheme
        id: xcode
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -n1)
          # The workspace also lists every CocoaPods scheme, so the first one is usually a library, not the app.
          # Expo names the app's scheme after its project: Sawwiq.xcworkspace -> scheme "Sawwiq".
          NAME="${WS%.xcworkspace}"
          SCHEME=$(xcodebuild -workspace "$WS" -list -json | NAME="$NAME" python3 -c 'import json,os,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; n=os.environ["NAME"]; print(n if n in s else next(x for x in s if not x.startswith("Pods") and x.lower()==n.lower()))')
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using $WS / $SCHEME"

      - name: Archive for a real iPhone, unsigned (Release bundles the JavaScript)
        working-directory: mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: |
          set +e
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" > "$RUNNER_TEMP/xcode.log" 2>&1
          rc=$?
          tail -n 40 "$RUNNER_TEMP/xcode.log"
          if [ $rc -ne 0 ]; then
            # Logs cannot be downloaded from the build session, so the reasons go out as annotations.
            grep -E "(error|fatal error):|Command .* failed" "$RUNNER_TEMP/xcode.log" | sed 's/^ *//' | sort -u | head -n 25 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit $rc
          fi

      - name: Package as .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)
          test -d "$APP" || { echo "::error::No .app in the archive: $(find "$RUNNER_TEMP/App.xcarchive" -maxdepth 4 | head -n 20 | tr '\n' ' ')"; exit 1; }
          test -f "$APP/main.jsbundle" || test -n "$(find "$APP" -name 'main.jsbundle' -print -quit)" || { echo "::error::The JavaScript bundle is not inside the app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "Sawwiq-iPhone.ipa" Payload
          ls -lh Sawwiq-iPhone.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$(basename "$APP")/Info.plist"

      - name: Copy the .ipa into the workspace
        run: cp "$RUNNER_TEMP/ipa/Sawwiq-iPhone.ipa" Sawwiq-iPhone.ipa

      - name: Publish the .ipa to the iPhone download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iphone-latest
          name: Sawwiq — latest iPhone test build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: Sawwiq-iPhone.ipa
          body: |
            iPhone test build of Sawwiq, unsigned, built from `${{ github.sha }}` (run ${{ github.run_id }}).
            API address: ${{ inputs.api_url }}
            **Install:** on a Windows or Mac computer, open Sideloadly, plug in the iPhone,
            drag `Sawwiq-iPhone.ipa` in, sign in with your Apple ID, Start.
            On the iPhone: Settings → Privacy & Security → Developer Mode → On (restart), then
            Settings → General → VPN & Device Management → trust your Apple ID.
            A free Apple ID install lasts 7 days. Push notifications do not work under a free Apple ID.
