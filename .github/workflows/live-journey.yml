# Controlled signed-in check on the live site (docs/53): the seeded demo
# provider runs the first-run setup end to end (upload, reload/resume, save,
# open, delete) and then measures the eight Studio routes at 1440x900 (one
# content measure, tab strip and footer on it, sidebar pills apart). Run it
# after a deploy: Actions → Live journey → Run workflow.
# Needs the SEED_DEMO_PASSWORD repository secret: add it once, run Maintenance →
# seed-demo (it gives the demo accounts that password), then run this. Creates no
# account and leaves nothing behind. Screenshots and journey.json are uploaded.
name: Live journey

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to check
        default: https://sawwiq.org

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ inputs.site || 'https://sawwiq.org' }}
      DEMO_EMAIL: nakhla-studio@sawwiq.test
      DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
    steps:
      - name: Check the demo password secret is there
        run: '[ -n "$DEMO_PASSWORD" ] || { echo "::error::Add the SEED_DEMO_PASSWORD repository secret, then run Maintenance → seed-demo once so the demo accounts take it (docs/53)."; exit 1; }'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the setup journey
        run: node tests/live/setup-journey.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-journey
          path: live-evidence/
          retention-days: 14
