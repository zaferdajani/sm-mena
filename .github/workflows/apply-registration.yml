name: Validate registration integration
on:
  push:
    branches: [feat/registration-phase]
    paths: [.github/workflows/apply-registration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/registration-phase
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed hardening and preserve the table call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/registration-hardening.py')
          p.write_text(p.read_text().replace('needle[:-2]', 'needle[:-1]'))
          PY
          python3 scripts/registration-hardening.py
          git rm scripts/registration-hardening.py
          git add app components lib messages tests
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(launch): enforce collaborator privacy and retain onboarding guide'
          git push origin HEAD:feat/registration-phase
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/unit/registration-phase.test.ts
      - name: Export reviewed source and framework docs
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          names=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          allowed={'.ts','.tsx','.css','.json','.md','.mjs','.cjs','.js','.yml','.yaml','.sql','.txt','.mts'}
          with zipfile.ZipFile('registration-integrated-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in allowed and not name.startswith('public/') and not p.name.startswith('.env'):z.write(p,name)
              for p in pathlib.Path('node_modules/next').rglob('*.md'):
                  if any(s in str(p) for s in ['authentication','data-security','route-handlers','route-segment-config','cookies']):z.write(p,'framework-docs/'+p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-integrated-source
          path: registration-integrated-source.zip
          retention-days: 3
