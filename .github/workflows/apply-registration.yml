name: Apply registration phase integration
on:
  push:
    branches: [feat/registration-phase]
    paths: [.github/workflows/apply-registration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/registration-phase
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed integration edits
        run: |
          python3 scripts/apply-registration-core.py
          python3 scripts/apply-registration-ui.py
          python3 scripts/apply-registration-final.py
          # Workflow updates are performed separately via an authorized connector.
          # The runner must not attempt a workflow write it has no permission for.
      - run: npm ci
      - name: Keep Drizzle snapshot consistent with additive migration
        run: |
          cp lib/db/migrations/0028_profile_publication.sql /tmp/profile-publication.sql
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('lib/db/migrations/meta/_journal.json')
          j=json.loads(p.read_text());assert j['entries'][-1]['idx']==28
          j['entries'].pop();p.write_text(json.dumps(j,indent=2)+'\n')
          pathlib.Path('lib/db/migrations/0028_profile_publication.sql').unlink()
          PY
          npm run db:generate -- --name=profile_publication
          test -f lib/db/migrations/meta/0028_snapshot.json
          cp /tmp/profile-publication.sql lib/db/migrations/0028_profile_publication.sql
      - name: Commit application source on the isolated branch
        run: |
          git diff --check
          git rm scripts/apply-registration-core.py scripts/apply-registration-ui.py scripts/apply-registration-final.py scripts/registration-ci.py scripts/registration-copy.json
          git add app components lib messages tests playwright.config.ts playwright.registration.config.ts vitest.config.mts docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(launch): integrate registration phase and owner-controlled publication'
          git push origin HEAD:feat/registration-phase
      - name: Check integration with newest main without overwriting conflicts
        run: |
          git fetch origin main
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge origin/main --no-edit
          git push origin HEAD:feat/registration-phase
      - name: Typecheck integrated source
        run: npm run typecheck
      - name: Lint integrated source
        run: npm run lint
      - name: Export source for review (no secrets or fonts)
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'.ts','.tsx','.css','.json','.md','.mjs','.cjs','.js','.yml','.yaml','.sql','.txt','.mts'}
          with zipfile.ZipFile('registration-integrated-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in allowed and not name.startswith('public/') and not p.name.startswith('.env'):
                      z.write(p,name)
          PY
          git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-integrated-source
          path: registration-integrated-source.zip
          retention-days: 3
