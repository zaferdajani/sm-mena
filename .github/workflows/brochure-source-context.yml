name: Brochure design source context
on:
  push:
    branches: [style/brochure-design-system]
    paths: [.github/workflows/brochure-source-context.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package tracked text source only (no secrets, media or fonts)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          allowed={'.ts','.tsx','.css','.json','.md','.mjs','.cjs','.js','.yml','.yaml','.sql'}
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('brochure-source-context.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in allowed and not name.startswith('public/') and not p.name.startswith('.env'):
                      z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brochure-source-context
          path: brochure-source-context.zip
          retention-days: 3
