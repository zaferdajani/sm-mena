name: Registration source context
on:
  push:
    branches: [feat/registration-phase]
    paths: [.github/workflows/registration-context.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'.ts','.tsx','.css','.json','.md','.mjs','.cjs','.js','.yml','.yaml','.sql','.txt'}
          with zipfile.ZipFile('registration-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in allowed and not name.startswith('public/') and not p.name.startswith('.env'):
                      z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: registration-source
          path: registration-source.zip
          retention-days: 3
