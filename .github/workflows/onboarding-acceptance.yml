name: Onboarding acceptance
on:
  push:
    branches: [fix/onboarding-acceptance]
permissions:
  contents: read
concurrency:
  group: onboarding-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export tracked text and installed Next documentation for review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          extensions = {'.ts','.tsx','.mts','.js','.jsx','.mjs','.cjs','.json','.css','.md','.yml','.yaml','.sql','.py','.txt'}
          with zipfile.ZipFile('/tmp/onboarding-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p = pathlib.Path(raw.decode())
              if p.is_file() and p.suffix in extensions and not p.name.startswith('.env'):
                z.write(p, str(p))
            docs = pathlib.Path('node_modules/next/dist/docs')
            for p in docs.rglob('*.md'):
              z.write(p, str(p))
            z.writestr('SOURCE_SHA.txt', subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-source-review
          path: /tmp/onboarding-source.zip
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-playwright
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7
