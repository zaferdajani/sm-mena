name: Onboarding acceptance
on:
  push:
    branches: [fix/onboarding-acceptance]
permissions:
  contents: read
concurrency:
  group: onboarding-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Materialize the reviewed source on the isolated branch only
        id: candidate
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = "fix/onboarding-acceptance"
          if [ -d .ops-onboarding ]; then
            for script in .ops-onboarding/0*.py; do python3 "$script"; done
            python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          expected=json.loads(Path('.ops-onboarding/expected.json').read_text())
          for path,digest in expected.items():
            actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
            assert actual==digest,(path,actual,digest)
          changes=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changes)<=set(expected),changes
          subprocess.check_call(['git','add','--',*expected.keys()])
          print('All 11 changed source/test files match the reviewed local SHA256 manifest.')
          PY
            git rm -r .ops-onboarding
            git config user.name "Sawwiq validation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(onboarding): atomic publishing and profile saves; revocation-safe connections; regression tests"
            git push origin "HEAD:$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export tracked text and installed Next documentation for review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          extensions = {'.ts','.tsx','.mts','.js','.jsx','.mjs','.cjs','.json','.css','.md','.yml','.yaml','.sql','.py','.txt'}
          with zipfile.ZipFile('/tmp/onboarding-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p = pathlib.Path(raw.decode())
              if p.is_file() and p.suffix in extensions and not p.name.startswith('.env'):
                z.write(p, str(p))
            for p in pathlib.Path('node_modules/next/dist/docs').rglob('*.md'):
              z.write(p, str(p))
            z.writestr('SOURCE_SHA.txt', subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-source-review
          path: /tmp/onboarding-source.zip
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-playwright
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7
