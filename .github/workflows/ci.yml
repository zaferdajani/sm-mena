name: CI

on:
  pull_request:
  push:
    branches: [main, feat/registration-phase]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Full-platform regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LAUNCH_PHASE: full
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Collect screenshots and metadata only
        if: always()
        run: python3 scripts/collect-design-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-evidence
          path: design-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  registration:
    name: Registration phase, privacy and mobile journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAUNCH_PHASE: registration
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.registration.config.ts
      - name: Collect registration screenshots and metadata only
        if: always()
        run: |
          if [ -d registration-report ]; then cp -r registration-report playwright-report; fi
          python3 scripts/collect-design-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-evidence
          path: design-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-report
          path: registration-report/
          retention-days: 7

  mobile:
    name: Mobile prototype (Expo) typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
