# One-click maintenance against the live database and storage (Supabase),
# no server needed. GitHub → Actions → Maintenance → Run workflow → pick a task.
#   migrate             apply database migrations (Vercel also does this on every deploy)
#   rebuild-demo-media  re-create the demo agencies with their photos in Supabase Storage
#   seed-demo           add demo data introduced since the last run (quick; keeps everything else)
#   reset-staff-2fa     clear staff two-factor sign-in so they can set it up again
#   recover-owner       owner locked out: clears the owner's 2FA and, with OWNER_RECOVERY_PASSWORD, sets a new password
#   db-activity         what the live database is busy with (connection states, long waits); read-only
#   pooler-check        read-only: runs admin-style queries through Supabase's transaction pooler with both drivers, counts stalls
#   pioneer-letters     create Founding Member letters for the names in "names" (already on Admin → Prospects); prints each link
#   seed-prospects      add the researched launch prospects (data/prospects-jordan.json) to Admin → Prospects; keeps existing rows
#   traffic-breakdown   read-only: how many of the last 30 days' views, clicks and visitors come from the same browser (no IPs are kept)
# Every Sunday at 02:17 UTC it also runs rebuild-demo-media, so the shared demo at
# /demo starts the week clean (docs/37-demo-link.md). Only demo agencies are touched.
# Uses the repository secrets DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# (and SEED_ADMIN_* if present). With SEED_DEMO_PASSWORD set, seed-demo and the
# rebuild give the demo agency accounts that password, which Actions → Live journey
# uses to sign in as the demo provider (docs/53). docs/27-vercel.md
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        type: choice
        options: [migrate, seed-demo, seed-prospects, pioneer-letters, rebuild-demo-media, reset-staff-2fa, recover-owner, db-activity, pooler-check, traffic-breakdown]
      names:
        description: "pioneer-letters: comma-separated prospect names, e.g. UPT House, Muhannad"
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * 0"

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      # The weekly schedule has no inputs: it resets the demo.
      TASK: ${{ inputs.task || 'rebuild-demo-media' }}
      # Passed as data, never pasted into the shell command.
      LETTER_NAMES: ${{ inputs.names }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_PROVIDER: supabase
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
      OWNER_RECOVERY_EMAIL: ${{ (inputs.task || 'rebuild-demo-media') == 'recover-owner' && secrets.OWNER_RECOVERY_EMAIL || '' }}
      OWNER_RECOVERY_PASSWORD: ${{ (inputs.task || 'rebuild-demo-media') == 'recover-owner' && secrets.OWNER_RECOVERY_PASSWORD || '' }}
    steps:
      - name: Check the secrets are there
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Add the DATABASE_URL repository secret (docs/25-supabase.md)."; exit 1; }
          if [ "$TASK" = "rebuild-demo-media" ]; then
            [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets."; exit 1; }
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Run ${{ inputs.task || 'rebuild-demo-media' }}
        run: |
          case "$TASK" in
            migrate) npm run --silent db:migrate ;;
            seed-demo) npm run --silent db:migrate && npx tsx lib/db/seed.ts ;;
            seed-prospects) npm run --silent db:migrate && npx tsx lib/db/seed-prospects.ts ;;
            pioneer-letters) npm run --silent db:migrate && npx tsx lib/db/create-letters.ts ;;
            rebuild-demo-media) npm run --silent db:migrate && npx tsx lib/db/rebuild-demo-media.ts ;;
            reset-staff-2fa) npx tsx lib/db/reset-staff-2fa.ts ;;
            db-activity) npx tsx lib/db/db-activity.ts ;;
            traffic-breakdown) npx tsx lib/db/traffic-breakdown.ts ;;
            pooler-check) npx tsx lib/db/pooler-check.ts ;;
            recover-owner)
              [ -n "$OWNER_RECOVERY_EMAIL" ] || { echo "::error::Add the OWNER_RECOVERY_EMAIL secret (and OWNER_RECOVERY_PASSWORD for a new password)."; exit 1; }
              npx tsx lib/db/seed.ts --admin-only ;;
          esac
