name: Team role input integration and focused browser checks
on:
  push:
    branches: [feat/team-role-suggestions]
    paths: [.github/workflows/team-role-integration.yml]
permissions:
  contents: write
jobs:
  role-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/team-role-suggestions
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply checked presentation and serialization patch
        run: |
          python3 scripts/apply-team-role-input.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/role-picker.spec.ts')
          s=p.read_text()
          assert 'import { joinAgency, uniqueHandle }' in s
          p.write_text(s.replace('import { joinAgency, uniqueHandle }', 'import { uniqueHandle }'))
          PY
          git diff --check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit/role-input.test.ts tests/unit/taxonomy.test.ts tests/unit/service-tags.test.ts tests/unit/messages.test.ts
      - name: Commit validated integration on feature branch only
        run: |
          git rm scripts/apply-team-role-input.py
          git add app components lib data messages scripts/gen-service-catalog.py tests docs
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(roles): integrate duplicate-safe role entry and preserve SEO labels'
          git push origin HEAD:feat/team-role-suggestions
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/role-picker.spec.ts --no-deps
        env:
          CI: "true"
      - name: Collect visual evidence without fonts or traces
        if: always()
        run: python3 scripts/collect-design-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-role-evidence
          path: design-evidence/
          retention-days: 7
