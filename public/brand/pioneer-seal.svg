<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="First Wave seal">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3a1"/>
      <stop offset=".45" stop-color="#d4a73c"/>
      <stop offset="1" stop-color="#9a6b14"/>
    </linearGradient>
    <radialGradient id="enamel" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1b8a62"/>
      <stop offset="1" stop-color="#0b4a35"/>
    </radialGradient>
  </defs>
  <!-- eight-pointed star crowning the medal -->
  <path fill="url(#gold)" d="M64 2l4.6 9.4 9.9-3.4-3.4 9.9L84.5 22.5l-9.4 4.6 3.4 9.9-9.9-3.4L64 43l-4.6-9.4-9.9 3.4 3.4-9.9-9.4-4.6 9.4-4.6-3.4-9.9 9.9 3.4z"/>
  <!-- smooth gold rim, emerald face -->
  <circle cx="64" cy="80" r="44" fill="url(#gold)"/>
  <circle cx="64" cy="80" r="36" fill="#f6efd6"/>
  <circle cx="64" cy="80" r="33.5" fill="url(#enamel)"/>
  <text x="64" y="94" text-anchor="middle" font-size="40" font-weight="700" fill="url(#gold)" font-family="Noto Sans Arabic, Noto Naskh Arabic, Tahoma, Arial, sans-serif">س</text>
</svg>
