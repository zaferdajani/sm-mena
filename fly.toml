# Sawwiq on Fly.io — ONE machine on purpose: PGlite and uploads live on the
# mounted volume, and rate limits are in memory. Move to Postgres
# (DATABASE_URL) and Supabase Storage before scaling above one machine.
app = "sawwiq-jo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  PGLITE_DIR = "/data/pglite"
  UPLOADS_DIR = "/data/uploads"
  # Demo agencies for the pilot; remove them in Admin → Agencies when real ones join.
  SEED_DEMO = "true"
  MONETIZATION_ENABLED = "false"
  # Secrets (set with `fly secrets set`, or via the GitHub workflow):
  #   SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD  first admin account
  #   ANTHROPIC_API_KEY                      enables the Claude matchmaker
  #   GOOGLE_PLACES_API_KEY                  enables Google ratings
  #   RESEND_API_KEY, EMAIL_FROM             inquiry emails
  #   CRON_SECRET                            protects /api/cron/google

[[mounts]]
  source = "sawwiq_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
